name: GitHub Profile Scanner

on:
  schedule:
    - cron: "0 2 * * *" # Runs daily at 2 AM
  workflow_dispatch: # Allows manual trigger

jobs:
  scan-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Analyze Profile Repositories
        run: |
          echo "Scanning repositories of BALAVIGNESHWARAN23..."
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/users/BALAVIGNESHWARAN23/repos \
          | jq '.[] | {name: .name, stars: .stargazers_count, forks: .forks_count}' > repositories.json
          cat repositories.json

      - name: Generate Contribution Report
        run: |
          echo "Fetching contributions for BALAVIGNESHWARAN23..."
          curl -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/users/BALAVIGNESHWARAN23/events \
          > contributions.json
          cat contributions.json

      - name: Upload Scan Results
        uses: actions/upload-artifact@v3
        with:
          name: github-scan-results
          path: |
            repositories.json
            contributions.json

      - name: Notify Completion
        run: echo "Scan completed for BALAVIGNESHWARAN23's GitHub profile!"
