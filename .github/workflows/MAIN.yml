name: Generate Snake

on:
  # Runs the action every 6 hours
  schedule:
    - cron: "0 */6 * * *"
  # Allows manual run from the Actions tab
  workflow_dispatch:

jobs:
  build:
    # The type of runner the job will run on
    runs-on: ubuntu-latest

    steps:
      # Checks out the repository so the workflow can access it
      - name: Checkout Repository
        uses: actions/checkout@v2

      # Generates the snake GIF and SVG
      - name: Generate Snake Animation
        uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: BALAVIGNESHWARAN23
          # Outputs the snake GIF and SVG into the "dist" directory
          gif_out_path: dist/github-contribution-grid-snake.gif
          svg_out_path: dist/github-contribution-grid-snake.svg

      # Show the status of the repository for debugging purposes
      - name: Show Repository Status
        run: git status

      # Push the changes to the output branch
      - name: Push Changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: output
          force: true

      # Deploy the snake animation to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
